  responses:
    BadRequest:
      description: JSON malformado ou parametro com formato invalido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badRequest:
              value:
                status: error
                code: BAD_REQUEST
                message: Corpo da requisicao nao e um JSON valido
    Unauthorized:
      description: |
        Token ausente/invalido (`UNAUTHORIZED`) ou access token expirado
        (`TOKEN_EXPIRED`). Em `TOKEN_EXPIRED` o cliente deve chamar
        `POST /api/auth/refresh` e repetir a requisicao.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                status: error
                code: UNAUTHORIZED
                message: Nao autorizado
            tokenExpired:
              value:
                status: error
                code: TOKEN_EXPIRED
                message: Access token expirado
    CapsuleNotFound:
      description: Capsula inexistente ou de outro usuario (a API nao diferencia os casos).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            capsuleNotFound:
              value:
                status: error
                code: NOT_FOUND
                message: Capsula nao encontrada
    CapsuleNotEditable:
      description: A capsula nao esta mais `SCHEDULED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            capsuleNotEditable:
              $ref: '#/components/examples/CapsuleNotEditableError'
    ValidationError:
      description: Um ou mais campos invalidos. Cada problema vem em `details`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validationError:
              value:
                status: error
                code: VALIDATION_ERROR
                message: Dados invalidos
                details:
                  - field: scheduleDate
                    message: Deve ser uma data em UTC (sufixo Z) pelo menos 1 minuto no futuro
                  - field: recipientEmail
                    message: E-mail invalido
    TooManyRequests:
      description: Muitas tentativas. Aguarde o tempo indicado em `Retry-After`.
      headers:
        Retry-After:
          description: Segundos ate poder tentar novamente.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tooManyRequests:
              value:
                status: error
                code: TOO_MANY_REQUESTS
                message: Muitas tentativas. Tente novamente em instantes
    InternalError:
      description: Erro inesperado no servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internalError:
              value:
                status: error
                code: INTERNAL_ERROR
                message: Erro interno do servidor
